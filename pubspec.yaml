name: jaspr_tailwind
description: Tailwind integration for Jaspr.
version: 0.3.7
repository: https://github.com/dinko7/jaspr_tailwind/
issue_tracker: https://github.com/dinko7/jaspr_tailwind/issues
documentation: https://docs.jaspr.site/eco/tailwind

topics:
  - jaspr
  - web
  - html
  - css
  - tailwind

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  # Deliberate floor, not an oversight: `build` 4.0.8+ needs `analyzer >=13.3.0`
  # while `jaspr_builder` pins `analyzer ^12.1.0`, so `dart pub get` fails in a
  # consuming Jaspr project. Raise it once jaspr_builder relaxes that pin; see
  # CHANGELOG.md 0.3.7.
  build: ^4.0.7
  glob: ^2.1.2
  path: ^1.8.3

dev_dependencies:
  lints: ^3.0.0
